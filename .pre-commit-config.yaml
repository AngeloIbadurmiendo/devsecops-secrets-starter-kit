repos:
  - repo: local
    hooks:
      - id: forbid-plaintext-secret-files
        name: Forbid plaintext secret files
        entry: python scripts/check_no_plaintext_files.py
        language: system
        types: [file]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
