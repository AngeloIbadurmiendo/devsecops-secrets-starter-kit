name: Reusable secret scan

on:
  workflow_call:
    inputs:
      config_path:
        description: Relative path to the Gitleaks configuration
        required: false
        default: .gitleaks.toml
        type: string
      retention_days:
        description: Days to retain the redacted SARIF report
        required: false
        default: 14
        type: number
    outputs:
      finding_count:
        description: Number of redacted findings reported by Gitleaks
        value: ${{ jobs.secret-scan.outputs.finding_count }}
      duration_ms:
        description: Gitleaks scan duration in milliseconds
        value: ${{ jobs.secret-scan.outputs.duration_ms }}
  workflow_dispatch:
    inputs:
      config_path:
        description: Relative path to the Gitleaks configuration
        required: false
        default: .gitleaks.toml
        type: string
      retention_days:
        description: Days to retain the redacted SARIF report
        required: false
        default: 14
        type: number

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan current tree and Git history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      finding_count: ${{ steps.scan.outputs.finding_count }}
      duration_ms: ${{ steps.scan.outputs.duration_ms }}
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate configuration path
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIG_PATH" = /* || "$CONFIG_PATH" == *".."* ]]; then
            echo "config_path must stay inside the repository" >&2
            exit 2
          fi
          if [[ ! -f "$CONFIG_PATH" ]]; then
            echo "Gitleaks configuration not found: $CONFIG_PATH" >&2
            exit 2
          fi

      - name: Install pinned Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 "$url" --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan repository
        id: scan
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
          REPORT_PATH: ${{ runner.temp }}/gitleaks-redacted.sarif
          METRICS_PATH: ${{ runner.temp }}/gitleaks-metrics.json
        shell: bash
        run: |
          set -u
          start_ns="$(date +%s%N)"
          set +e
          "$RUNNER_TEMP/gitleaks" git \
            --no-banner \
            --no-color \
            --redact \
            --config "$CONFIG_PATH" \
            --log-opts="--all" \
            --report-format sarif \
            --report-path "$REPORT_PATH" \
            --exit-code 1 \
            .
          exit_code=$?
          set -e
          end_ns="$(date +%s%N)"
          duration_ms=$(( (end_ns - start_ns) / 1000000 ))

          if [[ -s "$REPORT_PATH" ]]; then
            finding_count="$(jq '[.runs[]?.results[]?] | length' "$REPORT_PATH")"
            report_created=true
          else
            finding_count=0
            report_created=false
          fi

          jq --null-input \
            --arg generated_at_utc "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            --arg tool "gitleaks" \
            --arg tool_version "$GITLEAKS_VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg runner_os "$RUNNER_OS" \
            --argjson exit_code "$exit_code" \
            --argjson finding_count "$finding_count" \
            --argjson duration_ms "$duration_ms" \
            '{
              schema_version: 1,
              generated_at_utc: $generated_at_utc,
              tool: $tool,
              tool_version: $tool_version,
              commit: $commit,
              event: $event,
              runner_os: $runner_os,
              exit_code: $exit_code,
              finding_count: $finding_count,
              duration_ms: $duration_ms,
              report_redacted: true
            }' > "$METRICS_PATH"

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
          echo "finding_count=$finding_count" >> "$GITHUB_OUTPUT"
          echo "report_created=$report_created" >> "$GITHUB_OUTPUT"
          echo "metrics_created=true" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish sanitized summary
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
          FINDING_COUNT: ${{ steps.scan.outputs.finding_count }}
          DURATION_MS: ${{ steps.scan.outputs.duration_ms }}
        run: |
          {
            echo "### Gitleaks secret scan"
            echo
            echo "- Version: ${GITLEAKS_VERSION}"
            echo "- Findings: ${FINDING_COUNT:-unavailable}"
            echo "- Duration: ${DURATION_MS:-unavailable} ms"
            echo "- Exit code: ${EXIT_CODE:-unavailable}"
            echo "- Report: SARIF with secret values redacted"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted report
        if: always() && steps.scan.outputs.metrics_created == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-redacted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gitleaks-redacted.sarif
            ${{ runner.temp }}/gitleaks-metrics.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Enforce scan result
        if: always()
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        shell: bash
        run: |
          case "$EXIT_CODE" in
            0)
              echo "No secrets detected."
              ;;
            1)
              echo "Potential secret detected. Review the redacted artifact." >&2
              exit 1
              ;;
            *)
              echo "Gitleaks did not complete successfully (exit code: ${EXIT_CODE:-unavailable})." >&2
              exit 2
              ;;
          esac
